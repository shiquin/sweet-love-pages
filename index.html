<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>我们的甜心小店</title>
  <style>
    html, body { height: 100%; margin: 0; background: #fff2f7; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff2f7; }
    #loading {
      position: fixed; inset: 0; z-index: 1; display: grid; place-items: center;
      background: #fff2f7; color: #ad335d; font: 600 15px/1.6 system-ui, sans-serif;
      transition: opacity .25s ease, visibility .25s ease;
    }
    body.ready #loading { opacity: 0; visibility: hidden; }
  </style>
</head>
<body>
  <div id="loading">正在打开小店…</div>
  <iframe id="app" src="https://counsel-urw-cheque-variance.trycloudflare.com/" title="我们的甜心小店" allow="camera; microphone; clipboard-write; fullscreen; geolocation" referrerpolicy="no-referrer"></iframe>
  <script>
    var frame = document.getElementById('app');
    frame.addEventListener('load', function () { document.body.classList.add('ready'); });
    setTimeout(function () { document.body.classList.add('ready'); }, 4000);
  </script>
</body>
</html>
